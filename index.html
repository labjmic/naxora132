<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAXORA | Professional Portfolio</title>
    <style>
        /* Loading Animation */
        #loader {
            position: fixed;
            width: 100%;
            height: 100vh;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }
        .loader-text {
            font-size: 4rem;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 15px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            animation: introAnim 2s ease-in-out forwards;
            opacity: 0;
        }
        @keyframes introAnim {
            0% { opacity: 0; transform: scale(0.8); letter-spacing: 5px; }
            50% { opacity: 1; transform: scale(1.1); letter-spacing: 15px; }
            100% { opacity: 1; transform: scale(1); letter-spacing: 12px; }
        }

        /* General Styles */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: white; 
            margin: 0; 
            text-align: center; 
            transition: border 0.3s ease;
        }
        header { padding: 60px 20px; background: linear-gradient(135deg, #1e293b, #0f172a); }
        .logo { font-size: 3.5rem; font-weight: 900; letter-spacing: 10px; color: #38bdf8; text-transform: uppercase; }
        
        .nav-buttons { 
            position: sticky; 
            top: 0; 
            background: rgba(15, 23, 42, 0.95); 
            padding: 15px; 
            z-index: 1000; 
            border-bottom: 1px solid #1e293b; 
            backdrop-filter: blur(10px); 
        }
        .nav-btn { 
            background: #1e293b; 
            color: #38bdf8; 
            border: 2px solid #38bdf8; 
            padding: 10px 25px; 
            margin: 5px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        .nav-btn:hover { background: rgba(56, 189, 248, 0.1); }
        .nav-btn.active { background: #38bdf8; color: #0f172a; }
        
        .container { max-width: 1100px; margin: auto; padding: 40px 20px; min-height: 70vh; }
        
        /* Gallery Styles */
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
            margin-top: 30px; 
        }
        .media-box { 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 20px; 
            border: 1px solid #334155; 
            transition: transform 0.3s ease; 
        }
        .media-box:hover { transform: translateY(-10px); border-color: #38bdf8; }
        .media-box img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; }
        .file-name-display { 
            font-weight: bold; 
            color: #38bdf8; 
            display: block; 
            margin-top: 15px; 
            font-size: 1.2rem; 
            outline: none;
        }
        
        .content-section { display: none; animation: fadeIn 0.6s ease; } 
        .active-section { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Admin Trigger */
        .admin-trigger { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: transparent; 
            color: #1e293b; 
            border: none; 
            font-size: 0.8rem; 
            cursor: pointer; 
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-text">NAXORA</div>
    </div>

    <header>
        <div class="logo">NAXORA</div>
        <p style="color: #94a3b8; font-size: 1.1rem; letter-spacing: 2px;">CREATIVE VISUAL PORTFOLIO</p>
    </header>

    <nav class="nav-buttons">
        <button class="nav-btn active" onclick="showSection('home', this)">HOME</button>
        <button class="nav-btn" onclick="showSection('portfolio', this)">PORTFOLIO</button>
    </nav>

    <div class="container">
        <div id="home" class="content-section active-section">
            <div style="background: #1e293b; padding: 60px 20px; border-radius: 30px; border: 1px solid #334155;">
                <h1 style="color: #38bdf8; font-size: 2.5rem;">Welcome to Naxora</h1>
                <p style="font-size: 1.2rem; color: #cbd5e1; max-width: 600px; margin: auto;">
                    This is a professional showcase of creative projects. Explore the gallery to see my latest work.
                </p>
            </div>
        </div>

        <div id="portfolio" class="content-section">
            <h2 style="color: #38bdf8;">Visual Gallery</h2>
            <div class="gallery">
                
                <div class="media-box">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=500" alt="Work 1">
                    <span class="file-name-display">Abstract Design 01</span>
                </div>

                <div class="media-box">
                    <img src="https://images.unsplash.com/photo-1633356122544-f134324a6cee?auto=format&fit=crop&q=80&w=500" alt="Work 2">
                    <span class="file-name-display">Web Interface Concept</span>
                </div>

                <div class="media-box">
                    <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80&w=500" alt="Work 3">
                    <span class="file-name-display">Modern Tech Visuals</span>
                </div>

            </div>
            <p id="adminHint" style="display:none; color: #f59e0b; margin-top: 20px; font-weight: bold;">
                ADMIN MODE ACTIVE: You can now click on any text to edit it!
            </p>
        </div>
    </div>

    <button class="admin-trigger" onclick="enableAdminMode()">Admin Access</button>

    <script>
        // Remove Loader
        window.onload = function() {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 800);
            }, 2000);
        };

        // Navigation
        function showSection(sectionId, btn) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active-section'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active-section');
            btn.classList.add('active');
        }

        // Admin Edit Mode
        function enableAdminMode() {
            const password = prompt("Enter Admin Password:");
            if (password === "naxora123") {
                alert("Admin Access Granted! You can now edit text directly on the page.");
                
                // Enable editing for the entire body
                document.body.contentEditable = 'true';
                
                // Visual feedback that we are in Admin Mode
                document.body.style.border = "4px solid #38bdf8";
                document.getElementById('adminHint').style.display = 'block';
                
                // Show the portfolio section to start editing
                showSection('portfolio', document.querySelectorAll('.nav-btn')[1]);
            } else {
                alert("Access Denied!");
            }
        }
    </script>
</body>
</html>
